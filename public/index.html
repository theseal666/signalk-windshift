<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windshift Dashboard</title>
    <!-- Version query strings force browsers to refetch matching assets after
         every release instead of mixing cached JS with fresh HTML -->
    <link rel="stylesheet" href="style.css?v=0.4.0">
    <link rel="stylesheet" href="https://unpkg.com/uplot/dist/uPlot.min.css">
</head>
<body>
    <div id="dashboard">
        <header>
            <div class="metric" id="source">
                <label>Source</label>
                <select id="source-select"></select>
            </div>
            <div class="metric" id="current-twd">
                <label>Current TWD</label>
                <span class="value">--°</span>
            </div>
            <div class="metric" id="wind">
                <label>Avg Wind / Gust</label>
                <span class="value">--</span>
            </div>
            <div class="metric" id="delta-twd">
                <label>Delta</label>
                <span class="value">--°</span>
            </div>
            <div class="metric" id="trend">
                <label>Trend</label>
                <span class="value">--</span>
            </div>
            <div class="metric" id="cycle-period">
                <label>Cycle</label>
                <span class="value">--m</span>
            </div>
            <div class="metric" id="next-shift">
                <label>Next Shift</label>
                <span class="value">--:--</span>
            </div>
            <div class="metric" id="certainty">
                <label>Certainty</label>
                <div class="gauge-container">
                    <div class="gauge-bar" style="width: 0%"></div>
                </div>
            </div>
            <div class="metric" id="gradient-rate">
                <label>Drift</label>
                <span class="value">--</span>
            </div>
            <div class="metric" id="regime">
                <label>Regime</label>
                <span class="value">--</span>
            </div>
        </header>
        <div class="controls-bar">
            <div class="control-group">
                <label>Window</label>
                <div class="btn-group">
                    <button class="window-btn active" data-hours="0.5">30m</button>
                    <button class="window-btn" data-hours="1">1h</button>
                    <button class="window-btn" data-hours="3">3h</button>
                    <button class="window-btn" data-hours="6">6h</button>
                    <button class="window-btn" data-hours="24">24h</button>
                </div>
            </div>
            <div class="control-group">
                <label>Shift overlay</label>
                <div class="btn-group">
                    <button class="overlay-btn active" data-count="0">Off</button>
                    <button class="overlay-btn" data-count="2">Last 2</button>
                    <button class="overlay-btn" data-count="3">Last 3</button>
                    <button class="overlay-btn" data-count="5">Last 5</button>
                </div>
            </div>
        </div>
        <div id="gradient-alert" style="display:none">
            <span id="gradient-alert-text"></span>
        </div>
        <main>
            <button id="reset-zoom" title="Double-click chart to reset">↩ Reset zoom</button>
            <div id="chart-container"></div>
            <div id="overlay-container" style="display:none;"></div>
        </main>
    </div>
    <script src="https://unpkg.com/uplot/dist/uPlot.iife.min.js"></script>
    <script src="app.js?v=0.4.0"></script>
</body>
</html>
